[project]
name = "fieldguide-ai"
version = "0.1.0"
description = "A forward-deployed RAG agent that turns scattered company knowledge into executable customer/workflow decisions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.117.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.13.2",
    "langchain[openai]>=1.3.13",
    "model-runtime",
    "numpy>=2.0.0",
    "openai>=2.44.0",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.0.0",
    "questionary>=2.0",
    "rich>=14.0.0",
    "tabulate>=0.10.0",
]

[tool.uv.sources]
model-runtime = { git = "https://github.com/MeetPatel89/model-runtime.git", tag = "v0.2.0" }

[project.scripts]
fieldguide = "fieldguide_ai.interactive:main"

[project.optional-dependencies]
notebook = ["ipykernel"]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "fieldguide_ai"
module-root = ""

[tool.ty.src]
include = ["src", "tests", "explore.py"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
preview = true
select = [
    "E",
    "F",
    "I",
    "PTH",
    "N",
    "D",
    "C4",
    "ANN",
    "PYI",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
files = ["src", "tests", "example.py"]
python_version = "3.14"
plugins = ["pydantic.mypy"]
strict = true
enable_error_code = ["explicit-override"]
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = false
init_typed = false
warn_required_dynamic_aliases = true